<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>CleanFrame</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg">
    <div class="bg-layer" id="bg-a"></div>
    <div class="bg-layer" id="bg-b"></div>
    <div id="scrim"></div>
  </div>

  <main id="home">
    <header id="top">
      <div id="clock-wrap">
        <div id="clock"><span id="clock-time">--:--</span><span id="clock-ampm"></span></div>
        <div id="date"></div>
      </div>
      <div id="top-right">
        <div id="weather" class="hidden">
          <div id="wx-now">
            <div id="wx-icon"></div>
            <div id="wx-temp"></div>
          </div>
          <div id="wx-text"></div>
          <div id="wx-days"></div>
        </div>
      <button id="gear" class="focusable" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/>
        </svg>
      </button>
      </div>
    </header>

    <section id="dock">
      <div id="row-viewport">
        <div id="row"></div>
      </div>
      <div id="hint"><span class="key red"></span>Settings<span class="sep"></span><span class="key back">BACK</span>Picture only</div>
    </section>
  </main>

  <aside id="settings" aria-hidden="true">
    <h2>Settings</h2>
    <div id="settings-list"></div>
    <div id="search">
      <p class="search-help">Type a town or city with the on-screen keyboard, then press OK.</p>
      <input id="search-input" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. Amsterdam">
      <div id="search-results"></div>
    </div>
    <p class="settings-foot">BACK to close · changes are saved on the TV · weather data by Open-Meteo.com</p>
  </aside>

  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/luna.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
